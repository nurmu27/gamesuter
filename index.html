<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CS 1.6 — Knife Rush (Medium Graphics)</title>
<style>
  body { margin:0; overflow:hidden; background:#000; font-family:'Courier New', monospace; user-select:none; }
  canvas { display:block; }

  #hud {
    position:fixed; bottom:20px; left:20px; color:#ffcc00; font-size:20px; font-weight:bold;
    text-shadow:2px 2px 0 #000, 0 0 10px rgba(255,200,0,0.5);
    background:rgba(0,0,0,0.65); padding:8px 24px; border-radius:4px;
    border-left:6px solid #ffcc00; letter-spacing:1px; z-index:10; pointer-events:none;
  }
  #hud span { color:#fff; }
  #hud .armor { color:#66aaff; }

  #roundHud {
    position:fixed; top:15px; left:50%; transform:translateX(-50%);
    color:#fff; font-size:20px; font-weight:bold; text-shadow:2px 2px 0 #000;
    background:rgba(0,0,0,0.65); padding:8px 32px; border-radius:4px;
    border:1px solid #ffcc00; z-index:10; pointer-events:none; letter-spacing:1px;
  }
  #roundHud span { color:#ffcc00; }

  #weaponHud {
    position:fixed; bottom:20px; right:20px; color:#fff; font-size:20px; font-weight:bold;
    text-shadow:2px 2px 0 #000; background:rgba(0,0,0,0.6); padding:8px 24px; border-radius:4px;
    border-right:6px solid #ffaa00; letter-spacing:1px; z-index:10; pointer-events:none;
  }
  #weaponHud span { color:#ffcc00; }

  #enemyHud {
    position:fixed; top:15px; right:20px; color:#ff6666; font-size:18px; font-weight:bold;
    text-shadow:2px 2px 0 #000; background:rgba(0,0,0,0.6); padding:6px 20px; border-radius:4px;
    border-right:4px solid #ff4444; z-index:10; pointer-events:none;
  }

  #crosshair {
    position:fixed; top:50%; left:50%; width:20px; height:20px;
    transform:translate(-50%,-50%); pointer-events:none; z-index:15; opacity:0.9;
  }
  #crosshair::before, #crosshair::after {
    content:''; position:absolute; background:#0f0; box-shadow:0 0 8px #0f0;
  }
  #crosshair::before { top:9px; left:0; width:20px; height:2px; }
  #crosshair::after { left:9px; top:0; width:2px; height:20px; }
  #crosshair .dot {
    position:absolute; top:8px; left:8px; width:4px; height:4px;
    background:#0f0; border-radius:50%; box-shadow:0 0 10px #0f0;
  }

  #hitmarker {
    position:fixed; top:50%; left:50%; width:40px; height:40px;
    transform:translate(-50%,-50%); pointer-events:none; z-index:16;
    opacity:0; transition:opacity 0.08s;
  }
  #hitmarker::before, #hitmarker::after {
    content:''; position:absolute; background:#f00; box-shadow:0 0 12px #f00;
  }
  #hitmarker::before { top:0; left:18px; width:4px; height:40px; }
  #hitmarker::after { left:0; top:18px; width:40px; height:4px; }
  #hitmarker.active { opacity:1; }

  #notify {
    position:fixed; top:22%; left:50%; transform:translateX(-50%);
    color:#fff; font-size:30px; font-weight:bold; text-shadow:2px 2px 0 #000, 0 0 20px red;
    background:rgba(0,0,0,0.75); padding:14px 48px; border-radius:4px;
    border:2px solid #ffcc00; z-index:20; display:none; letter-spacing:2px; white-space:nowrap;
    text-align:center;
  }

  #hint {
    position:fixed; top:60px; left:50%; transform:translateX(-50%);
    color:#ddd; font-size:13px; background:rgba(0,0,0,0.7); padding:6px 20px;
    border-radius:20px; border:1px solid #555; z-index:10; letter-spacing:0.5px;
    pointer-events:none; white-space:nowrap;
  }
  #hint b { color:#ffcc00; }

  #scope {
    position:fixed; top:0; left:0; width:100%; height:100%;
    display:none; pointer-events:none; z-index:14;
  }
  #scope .vignette {
    position:absolute; top:0; left:0; width:100%; height:100%;
    background:radial-gradient(circle at center, transparent 0%, transparent 25%, rgba(0,0,0,0.85) 28%, #000 100%);
  }
  #scope .crosshair-scope {
    position:absolute; top:50%; left:50%; width:80%; height:80%;
    transform:translate(-50%,-50%); border:2px solid rgba(0,255,0,0.25); border-radius:50%;
  }
  #scope .line-h {
    position:absolute; top:50%; left:50%; width:70%; height:2px;
    background:rgba(0,255,0,0.5); transform:translate(-50%,-50%); box-shadow:0 0 8px #0f0;
  }
  #scope .line-v {
    position:absolute; top:50%; left:50%; width:2px; height:70%;
    background:rgba(0,255,0,0.5); transform:translate(-50%,-50%); box-shadow:0 0 8px #0f0;
  }
  #scope .dot {
    position:absolute; top:50%; left:50%; width:6px; height:6px;
    background:#f00; border-radius:50%; transform:translate(-50%,-50%); box-shadow:0 0 20px red;
  }

  #damageFlash {
    position:fixed; top:0; left:0; width:100%; height:100%;
    pointer-events:none; z-index:13; opacity:0;
    background:radial-gradient(circle at center, transparent 40%, rgba(255,0,0,0.7) 100%);
    transition:opacity 0.1s;
  }
</style>
</head>
<body>

  <div id="hud">HP: <span id="hp">100</span> | <span class="armor">ARMOR: <span id="armor">0</span></span> | $ <span id="money">0</span></div>
  <div id="roundHud">РАУНД <span id="round">1</span> / 6</div>
  <div id="enemyHud">Врагов: <span id="enemies">0</span></div>
  <div id="weaponHud"><span id="wname">PISTOL</span> | <span id="ammo">12</span>/<span id="reserve">60</span></div>
  <div id="crosshair"><div class="dot"></div></div>
  <div id="hitmarker"></div>
  <div id="damageFlash"></div>
  <div id="notify"></div>
  <div id="hint"><b>WASD</b> движение | <b>Shift</b> бег | <b>ЛКМ</b> стрелять | <b>ПКМ</b> прицел | <b>R</b> перезарядка | <b>1-6</b> оружие | <b>Space</b> прыжок</div>

  <div id="scope">
    <div class="vignette"></div>
    <div class="crosshair-scope"></div>
    <div class="line-h"></div>
    <div class="line-v"></div>
    <div class="dot"></div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
  import * as THREE from 'three';

  // ==================== СЦЕНА ====================
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x14142a);
  scene.fog = new THREE.FogExp2(0x14142a, 0.0022);

  const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 2000);
  const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); // среднее качество
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap; // средние тени
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  document.body.appendChild(renderer.domElement);

  // ==================== СВЕТ (средний уровень) ====================
  scene.add(new THREE.AmbientLight(0x555575, 0.9));

  const sun = new THREE.DirectionalLight(0xffeedd, 1.8);
  sun.position.set(80, 160, 90);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024); // средние тени
  sun.shadow.camera.left = -150; sun.shadow.camera.right = 150;
  sun.shadow.camera.top = 150; sun.shadow.camera.bottom = -150;
  sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.03;
  scene.add(sun);

  const fillLight = new THREE.PointLight(0x4466ff, 0.8, 350);
  fillLight.position.set(-50, 50, -50);
  scene.add(fillLight);
  const fillLight2 = new THREE.PointLight(0xff6644, 0.6, 350);
  fillLight2.position.set(50, 45, 50);
  scene.add(fillLight2);

  // ==================== ЗЕМЛЯ ====================
  const groundGeo = new THREE.PlaneGeometry(1200, 1200);
  const groundMat = new THREE.MeshStandardMaterial({ color:0x15152a, roughness:0.9, metalness:0.1 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI/2;
  ground.position.y = -0.02;
  ground.receiveShadow = true;
  scene.add(ground);

  // Простая сетка на земле
  const groundGrid = new THREE.GridHelper(1200, 120, 0x334466, 0x1a2a44);
  groundGrid.position.y = 0.01;
  scene.add(groundGrid);

  // ==================== ЗДАНИЕ ====================
  const BUILDING_W = 130;
  const BUILDING_D = 130;
  const BUILDING_H = 10;
  const ROOF_Y = BUILDING_H;

  const buildingMat = new THREE.MeshStandardMaterial({
    color: 0x3a4a6a, roughness: 0.6, metalness: 0.3, emissive: 0x0a0a1a
  });
  const building = new THREE.Mesh(new THREE.BoxGeometry(BUILDING_W, BUILDING_H, BUILDING_D), buildingMat);
  building.position.set(0, BUILDING_H/2, 0);
  building.castShadow = true;
  building.receiveShadow = true;
  scene.add(building);

  const bEdges = new THREE.EdgesGeometry(building.geometry);
  const bLine = new THREE.LineSegments(bEdges, new THREE.LineBasicMaterial({ color:0x6688aa, opacity:0.5, transparent:true }));
  building.add(bLine);

  // Крыша
  const roofMat = new THREE.MeshStandardMaterial({
    color: 0x4a5a7a, roughness: 0.6, metalness: 0.4, emissive: 0x0a0a18
  });
  const roof = new THREE.Mesh(new THREE.BoxGeometry(BUILDING_W, 0.3, BUILDING_D), roofMat);
  roof.position.set(0, ROOF_Y + 0.15, 0);
  roof.receiveShadow = true;
  scene.add(roof);

  // Сетка на крыше
  const roofGrid = new THREE.GridHelper(BUILDING_W, 40, 0x6699cc, 0x224466);
  roofGrid.position.y = ROOF_Y + 0.32;
  roofGrid.material.transparent = true;
  roofGrid.material.opacity = 0.4;
  scene.add(roofGrid);

  // Парапет
  const parapetMat = new THREE.MeshStandardMaterial({ color:0x6a7a9a, metalness:0.5, roughness:0.4 });
  const parapetH = 1.2;
  const parapetT = 0.5;

  function addParapet(x, z, w, d) {
    const p = new THREE.Mesh(new THREE.BoxGeometry(w, parapetH, d), parapetMat);
    p.position.set(x, ROOF_Y + parapetH/2, z);
    p.castShadow = true; p.receiveShadow = true;
    scene.add(p);
    const glow = new THREE.Mesh(
      new THREE.BoxGeometry(w*0.9, 0.1, d*0.9),
      new THREE.MeshBasicMaterial({ color:0x00ffcc, transparent:true, opacity:0.5 })
    );
    glow.position.set(x, ROOF_Y + parapetH + 0.05, z);
    scene.add(glow);
  }
  addParapet(0,  BUILDING_D/2, BUILDING_W, parapetT);
  addParapet(0, -BUILDING_D/2, BUILDING_W, parapetT);
  addParapet( BUILDING_W/2, 0, parapetT, BUILDING_D);
  addParapet(-BUILDING_W/2, 0, parapetT, BUILDING_D);

  const cornerMat = new THREE.MeshBasicMaterial({ color:0x00ffff, transparent:true, opacity:0.6 });
  const cornerGeo = new THREE.BoxGeometry(0.7, parapetH + 0.6, 0.7);
  [[BUILDING_W/2, BUILDING_D/2], [-BUILDING_W/2, BUILDING_D/2], [BUILDING_W/2, -BUILDING_D/2], [-BUILDING_W/2, -BUILDING_D/2]].forEach(([cx, cz]) => {
    const c = new THREE.Mesh(cornerGeo, cornerMat);
    c.position.set(cx, ROOF_Y + (parapetH+0.6)/2, cz);
    scene.add(c);
  });

  // ==================== УКРЫТИЯ ====================
  const coverBoxes = [];
  function addCover(x, z, w, h, d, color) {
    const mat = new THREE.MeshStandardMaterial({
      color, roughness:0.5, metalness:0.4,
      emissive: new THREE.Color(color).multiplyScalar(0.1),
    });
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.position.set(x, ROOF_Y + h/2 + 0.3, z);
    m.castShadow = true; m.receiveShadow = true;
    scene.add(m);

    const e = new THREE.EdgesGeometry(m.geometry);
    const l = new THREE.LineSegments(e, new THREE.LineBasicMaterial({ color:0x6688aa, opacity:0.4, transparent:true }));
    m.add(l);

    coverBoxes.push({
      mesh: m,
      minX: x - w/2, maxX: x + w/2,
      minZ: z - d/2, maxZ: z + d/2,
      minY: ROOF_Y + 0.3, maxY: ROOF_Y + 0.3 + h,
      height: h
    });
    return m;
  }

  addCover(0, 0, 10, 4.0, 10, 0x4a4a6a);
  addCover(0, 0, 6, 6.5, 6, 0x5a5a7a);
  addCover(-40, -40, 8, 3.5, 8, 0x4a3a5a);
  addCover( 40,  40, 8, 3.5, 8, 0x5a3a4a);
  addCover(-40,  40, 8, 3.0, 8, 0x3a4a5a);
  addCover( 40, -40, 8, 3.0, 8, 0x5a4a3a);
  addCover(-25, 0, 4, 2.5, 20, 0x3a5a4a);
  addCover( 25, 0, 4, 2.5, 20, 0x5a3a5a);
  addCover(0, -25, 20, 2.5, 4, 0x4a5a3a);
  addCover(0,  25, 20, 2.5, 4, 0x5a4a3a);
  addCover(-55, -15, 6, 3.0, 12, 0x3a4a6a);
  addCover( 55,  15, 6, 3.0, 12, 0x6a3a4a);
  addCover(-15, -55, 12, 3.0, 6, 0x4a6a3a);
  addCover( 15,  55, 12, 3.0, 6, 0x6a4a3a);
  addCover(-50, 50, 4, 2.0, 4, 0x5a5a3a);
  addCover( 50, -50, 4, 2.0, 4, 0x3a5a5a);
  addCover( 50,  50, 4, 2.0, 4, 0x5a3a3a);
  addCover(-50, -50, 4, 2.0, 4, 0x3a3a5a);
  addCover(-30, 20, 6, 2.5, 6, 0x4a5a6a);
  addCover( 30, -20, 6, 2.5, 6, 0x6a5a4a);
  addCover( 30,  20, 6, 2.5, 6, 0x5a6a4a);
  addCover(-30, -20, 6, 2.5, 6, 0x4a4a5a);
  addCover(-58, -58, 8, 5.0, 8, 0x5a4a6a);
  addCover( 58,  58, 8, 5.0, 8, 0x6a4a5a);
  addCover(-58,  58, 8, 5.0, 8, 0x4a6a5a);
  addCover( 58, -58, 8, 5.0, 8, 0x5a6a4a);

  // ==================== ВРАГИ (с ножами) ====================
  const bots = [];
  const BOT_RADIUS = 0.5;
  const BOT_HEIGHT = 1.8;

  function createBot(x, z, round) {
    const group = new THREE.Group();

    const hpMult = 1 + (round - 1) * 0.45;
    const dmgMult = 1 + (round - 1) * 0.4;
    const speedMult = 1 + (round - 1) * 0.15;

    const bodyMat = new THREE.MeshStandardMaterial({
      color: 0xbb2222, roughness: 0.5, metalness: 0.3, emissive: 0x330000
    });
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.55, 1.3, 8), bodyMat);
    body.position.y = 0.65; body.castShadow = true; body.receiveShadow = true;
    group.add(body);

    const headMat = new THREE.MeshStandardMaterial({ color:0xffaa33, roughness:0.5, metalness:0.2 });
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 10, 10), headMat);
    head.position.y = 1.55; head.castShadow = true;
    group.add(head);

    const eyeMat = new THREE.MeshBasicMaterial({ color:0xff2200 });
    const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), eyeMat);
    eyeL.position.set(-0.15, 1.6, 0.3); group.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.15; group.add(eyeR);

    const armMat = new THREE.MeshStandardMaterial({ color:0xaa2222, roughness:0.5, metalness:0.2 });
    const armL = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.9, 6), armMat);
    armL.position.set(-0.6, 0.9, 0); armL.rotation.z = 0.4; armL.rotation.x = -0.6; armL.castShadow = true;
    group.add(armL);
    const armR = armL.clone(); armR.position.x = 0.6; armR.rotation.z = -0.4; armR.rotation.x = -0.6;
    group.add(armR);

    // Нож
    const knifeGroup = new THREE.Group();
    const bladeMat = new THREE.MeshStandardMaterial({ color:0xdddddd, metalness:0.9, roughness:0.2 });
    const blade = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.02, 0.5), bladeMat);
    blade.position.z = -0.3;
    knifeGroup.add(blade);
    const handleMat = new THREE.MeshStandardMaterial({ color:0x333333, roughness:0.7, metalness:0.2 });
    const handle = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.07, 0.16), handleMat);
    knifeGroup.add(handle);
    const bladeGlow = new THREE.Mesh(
      new THREE.BoxGeometry(0.06, 0.03, 0.5),
      new THREE.MeshBasicMaterial({ color:0x88ddff, transparent:true, opacity:0.35 })
    );
    bladeGlow.position.z = -0.3;
    knifeGroup.add(bladeGlow);
    knifeGroup.position.set(0.65, 1.0, -0.4);
    knifeGroup.rotation.x = 0.2;
    group.add(knifeGroup);

    const legMat = new THREE.MeshStandardMaterial({ color:0x111122, roughness:0.6, metalness:0.2 });
    const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.8, 6), legMat);
    legL.position.set(-0.2, -0.1, 0); legL.castShadow = true; group.add(legL);
    const legR = legL.clone(); legR.position.x = 0.2; group.add(legR);

    // Аура (простая)
    const auraMat = new THREE.MeshBasicMaterial({ color:0xff0000, transparent:true, opacity:0.25, side:THREE.DoubleSide });
    const aura = new THREE.Mesh(new THREE.RingGeometry(0.6, 0.85, 16), auraMat);
    aura.rotation.x = -Math.PI/2;
    aura.position.y = 0.05;
    group.add(aura);

    group.position.set(x, ROOF_Y + 0.3, z);
    group.userData = {
      hp: 100 * hpMult,
      maxHp: 100 * hpMult,
      damage: 12 * dmgMult,
      origin: new THREE.Vector3(x, ROOF_Y + 0.3, z),
      phase: Math.random() * Math.PI * 2,
      speed: speedMult,
      dead: false,
      attackCooldown: 0,
      isEnemy: true,
      knifeGroup,
      aura,
    };
    scene.add(group);
    bots.push(group);
    return group;
  }

  function isInsideCover(x, z, margin) {
    for (const c of coverBoxes) {
      if (x > c.minX - margin && x < c.maxX + margin &&
          z > c.minZ - margin && z < c.maxZ + margin) {
        return true;
      }
    }
    return false;
  }

  function spawnBotsForRound(round) {
    for (const b of bots) scene.remove(b);
    bots.length = 0;

    const count = 6 + round * 4;
    const spawnMargin = 8;
    const halfW = BUILDING_W/2 - spawnMargin;
    const halfD = BUILDING_D/2 - spawnMargin;

    for (let i = 0; i < count; i++) {
      let x, z, tries = 0;
      do {
        x = (Math.random() - 0.5) * 2 * halfW;
        z = (Math.random() - 0.5) * 2 * halfD;
        tries++;
      } while (tries < 40 && isInsideCover(x, z, 2));
      createBot(x, z, round);
    }
    updateEnemyHud();
  }

  // ==================== ТИММЕЙТЫ ====================
  const teammates = [];
  let teammatesSpawned = false;

  function createTeammate(x, z) {
    const group = new THREE.Group();

    const bodyMat = new THREE.MeshStandardMaterial({
      color:0x3388cc, roughness:0.5, metalness:0.3, emissive:0x001133
    });
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.55, 1.3, 8), bodyMat);
    body.position.y = 0.65; body.castShadow = true; body.receiveShadow = true;
    group.add(body);

    const headMat = new THREE.MeshStandardMaterial({ color:0x55aaff, roughness:0.5, metalness:0.2 });
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 10, 10), headMat);
    head.position.y = 1.55; head.castShadow = true;
    group.add(head);

    const eyeMat = new THREE.MeshBasicMaterial({ color:0x00ff88 });
    const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), eyeMat);
    eyeL.position.set(-0.15, 1.6, 0.3); group.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.15; group.add(eyeR);

    const armMat = new THREE.MeshStandardMaterial({ color:0x2266aa, roughness:0.5, metalness:0.2 });
    const armL = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.9, 6), armMat);
    armL.position.set(-0.6, 0.9, 0); armL.rotation.z = 0.3; armL.castShadow = true;
    group.add(armL);
    const armR = armL.clone(); armR.position.x = 0.6; armR.rotation.z = -0.3;
    group.add(armR);

    const legMat = new THREE.MeshStandardMaterial({ color:0x222244, roughness:0.6 });
    const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.8, 6), legMat);
    legL.position.set(-0.2, -0.1, 0); legL.castShadow = true; group.add(legL);
    const legR = legL.clone(); legR.position.x = 0.2; group.add(legR);

    const auraMat = new THREE.MeshBasicMaterial({ color:0x00ff88, transparent:true, opacity:0.25, side:THREE.DoubleSide });
    const aura = new THREE.Mesh(new THREE.RingGeometry(0.6, 0.85, 16), auraMat);
    aura.rotation.x = -Math.PI/2;
    aura.position.y = 0.05;
    group.add(aura);

    group.position.set(x, ROOF_Y + 0.3, z);
    group.userData = {
      hp: 200,
      maxHp: 200,
      damage: 18,
      phase: Math.random() * Math.PI * 2,
      attackCooldown: 0,
      dead: false,
      isTeammate: true,
      aura,
    };
    scene.add(group);
    teammates.push(group);
    return group;
  }

  function spawnTeammates() {
    if (teammatesSpawned) return;
    teammatesSpawned = true;
    const px = player.pos.x;
    const pz = player.pos.z;
    createTeammate(px + 3, pz);
    createTeammate(px - 3, pz);
    showNotify('+ 2 СОЮЗНИКА ПРИБЫЛИ!', '#00ff88');
  }

  // ==================== ОРУЖИЕ ====================
  const WEAPONS = {
    1: { name:'PISTOL', damage:25, mag:12, current:12, reserve:60, reloadTime:1.5, fireDelay:0.25, auto:false, model:'pistol', scope:false },
    2: { name:'KNIFE', damage:70, mag:Infinity, current:Infinity, reserve:Infinity, reloadTime:0, fireDelay:0.45, auto:false, model:'knife', melee:true, range:3, scope:false },
    3: { name:'M4A1', damage:33, mag:30, current:30, reserve:90, reloadTime:2.3, fireDelay:0.1, auto:true, model:'rifle', scope:false },
    4: { name:'AWP', damage:140, mag:5, current:5, reserve:30, reloadTime:3.0, fireDelay:1.2, auto:false, model:'sniper', scope:true, scopeZoom:5 },
    5: { name:'DEAGLE', damage:60, mag:7, current:7, reserve:35, reloadTime:2.0, fireDelay:0.35, auto:false, model:'pistol', scope:false },
    6: { name:'M249', damage:28, mag:100, current:100, reserve:200, reloadTime:5.5, fireDelay:0.08, auto:true, model:'lmg', scope:false },
  };

  let currentWeaponId = 1;
  let isReloading = false;
  let lastShotTime = 0;
  let score = 0;
  let money = 0;

  let isAiming = false;
  let defaultFov = 75;
  let aimFov = 50;
  let currentFov = defaultFov;

  // ==================== МОДЕЛИ ОРУЖИЯ ====================
  const gunGroup = new THREE.Group();
  camera.add(gunGroup);
  scene.add(camera);

  function buildGunMesh(type) {
    gunGroup.clear();
    const metalMat = new THREE.MeshStandardMaterial({ color:0x2a2a2a, metalness:0.8, roughness:0.3 });
    const darkMat = new THREE.MeshStandardMaterial({ color:0x151515, metalness:0.7, roughness:0.4 });
    const woodMat = new THREE.MeshStandardMaterial({ color:0x5a3a1a, roughness:0.6, metalness:0.1 });
    const glowMat = new THREE.MeshBasicMaterial({ color:0x00ffcc, transparent:true, opacity:0.6 });

    if (type === 'pistol') {
      const slide = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.08, 0.45), metalMat);
      slide.position.set(0.25, -0.15, -0.55); gunGroup.add(slide);
      const grip = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.2, 0.12), darkMat);
      grip.position.set(0.25, -0.27, -0.35); grip.rotation.x = 0.2; gunGroup.add(grip);
      const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.15, 8), metalMat);
      barrel.rotation.x = Math.PI/2; barrel.position.set(0.25, -0.15, -0.8); gunGroup.add(barrel);
      const sight = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.04, 0.06), glowMat);
      sight.position.set(0.25, -0.09, -0.65); gunGroup.add(sight);
    } else if (type === 'knife') {
      const blade = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.02, 0.45), new THREE.MeshStandardMaterial({ color:0xccccdd, metalness:0.95, roughness:0.1 }));
      blade.position.set(0.3, -0.15, -0.45); gunGroup.add(blade);
      const handle = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 0.15), woodMat);
      handle.position.set(0.3, -0.15, -0.2); gunGroup.add(handle);
      const guard = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.02, 0.04), metalMat);
      guard.position.set(0.3, -0.15, -0.28); gunGroup.add(guard);
      const glow = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.03, 0.4), glowMat);
      glow.position.set(0.3, -0.15, -0.45); gunGroup.add(glow);
    } else if (type === 'rifle') {
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.9), darkMat);
      body.position.set(0.25, -0.18, -0.75); gunGroup.add(body);
      const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.4, 8), metalMat);
      barrel.rotation.x = Math.PI/2; barrel.position.set(0.25, -0.16, -1.25); gunGroup.add(barrel);
      const stock = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.1, 0.25), woodMat);
      stock.position.set(0.25, -0.18, -0.2); gunGroup.add(stock);
      const mag = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.18, 0.1), metalMat);
      mag.position.set(0.25, -0.3, -0.7); gunGroup.add(mag);
      const scope = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.2, 8), metalMat);
      scope.rotation.x = Math.PI/2; scope.position.set(0.25, -0.06, -0.8); gunGroup.add(scope);
      const glow = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.02), glowMat);
      glow.position.set(0.25, -0.18, -1.45); gunGroup.add(glow);
    } else if (type === 'sniper') {
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 1.2), darkMat);
      body.position.set(0.25, -0.18, -1.0); gunGroup.add(body);
      const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.6, 8), metalMat);
      barrel.rotation.x = Math.PI/2; barrel.position.set(0.25, -0.16, -1.7); gunGroup.add(barrel);
      const scope = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.35, 8), metalMat);
      scope.rotation.x = Math.PI/2; scope.position.set(0.25, -0.06, -0.95); gunGroup.add(scope);
      const stock = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.14, 0.35), woodMat);
      stock.position.set(0.25, -0.18, -0.35); gunGroup.add(stock);
      const glow = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.02, 8), glowMat);
      glow.rotation.x = Math.PI/2; glow.position.set(0.25, -0.06, -1.55); gunGroup.add(glow);
      const bipodL = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.25, 0.02), metalMat);
      bipodL.position.set(0.18, -0.38, -1.4); bipodL.rotation.z = 0.3; gunGroup.add(bipodL);
      const bipodR = bipodL.clone(); bipodR.position.x = 0.32; bipodR.rotation.z = -0.3; gunGroup.add(bipodR);
    } else if (type === 'lmg') {
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.14, 1.0), darkMat);
      body.position.set(0.25, -0.2, -0.85); gunGroup.add(body);
      const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.7, 8), metalMat);
      barrel.rotation.x = Math.PI/2; barrel.position.set(0.25, -0.18, -1.6); gunGroup.add(barrel);
      const drum = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.15, 10), metalMat);
      drum.rotation.z = Math.PI/2; drum.position.set(0.25, -0.35, -0.75); gunGroup.add(drum);
      const stock = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.12, 0.3), woodMat);
      stock.position.set(0.25, -0.2, -0.25); gunGroup.add(stock);
      const glow = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.02, 8), glowMat);
      glow.rotation.x = Math.PI/2; glow.position.set(0.25, -0.18, -1.95); gunGroup.add(glow);
      const belt = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.02, 0.35), new THREE.MeshStandardMaterial({ color:0xccaa00, metalness:0.7 }));
      belt.position.set(0.25, -0.5, -0.55); gunGroup.add(belt);
    }
  }

  // ==================== ИГРОК ====================
  const player = {
    pos: new THREE.Vector3(0, ROOF_Y + 1.7 + 0.3, 0),
    vel: new THREE.Vector3(),
    onGround: true,
    height: 1.7,
    radius: 0.4,
    hp: 100,
    maxHp: 100,
    armor: 0,
    maxArmor: 100,
  };

  camera.position.copy(player.pos);
  let yaw = 0;
  let pitch = 0;

  // ==================== УПРАВЛЕНИЕ ====================
  const keys = {};
  document.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Digit1') switchWeapon(1);
    if (e.code === 'Digit2') switchWeapon(2);
    if (e.code === 'Digit3') switchWeapon(3);
    if (e.code === 'Digit4') switchWeapon(4);
    if (e.code === 'Digit5') switchWeapon(5);
    if (e.code === 'Digit6') switchWeapon(6);
    if (e.code === 'KeyR') reload();
    e.preventDefault();
  });
  document.addEventListener('keyup', e => keys[e.code] = false);

  let mouseDown = false;
  let rightDown = false;
  document.addEventListener('mousedown', e => {
    if (e.button === 0) mouseDown = true;
    if (e.button === 2) { rightDown = true; setAiming(true); }
  });
  document.addEventListener('mouseup', e => {
    if (e.button === 0) mouseDown = false;
    if (e.button === 2) { rightDown = false; setAiming(false); }
  });
  document.addEventListener('contextmenu', e => e.preventDefault());

  renderer.domElement.addEventListener('click', () => {
    renderer.domElement.requestPointerLock();
  });

  document.addEventListener('mousemove', e => {
    if (document.pointerLockElement) {
      const sens = isAiming ? 0.0008 : 0.0018;
      yaw -= e.movementX * sens;
      pitch -= e.movementY * sens;
      pitch = Math.max(-Math.PI/2 + 0.01, Math.min(Math.PI/2 - 0.01, pitch));
    }
  });

  // ==================== ПРИЦЕЛ ====================
  const scopeEl = document.getElementById('scope');
  const crosshairEl = document.getElementById('crosshair');
  const hitmarkerEl = document.getElementById('hitmarker');
  const damageFlashEl = document.getElementById('damageFlash');

  function setAiming(on) {
    const w = WEAPONS[currentWeaponId];
    isAiming = on && !w.melee && !isReloading;
    if (isAiming) {
      if (w.scope) {
        scopeEl.style.display = 'block';
        crosshairEl.style.display = 'none';
        gunGroup.visible = false;
        currentFov = defaultFov / (w.scopeZoom || 4);
      } else {
        scopeEl.style.display = 'none';
        crosshairEl.style.display = 'block';
        gunGroup.visible = true;
        currentFov = aimFov;
      }
    } else {
      scopeEl.style.display = 'none';
      crosshairEl.style.display = 'block';
      gunGroup.visible = true;
      currentFov = defaultFov;
    }
  }

  // ==================== UI ====================
  function updateUI() {
    document.getElementById('hp').textContent = Math.max(0, Math.round(player.hp));
    document.getElementById('armor').textContent = Math.max(0, Math.round(player.armor));
    document.getElementById('money').textContent = money;
    const w = WEAPONS[currentWeaponId];
    document.getElementById('wname').textContent = w.name;
    document.getElementById('ammo').textContent = w.melee ? '∞' : w.current;
    document.getElementById('reserve').textContent = w.melee ? '∞' : w.reserve;
  }

  function updateEnemyHud() {
    document.getElementById('enemies').textContent = bots.length;
  }

  function updateRoundHud(round) {
    document.getElementById('round').textContent = round;
  }

  function showNotify(text, color = '#ffcc00') {
    const n = document.getElementById('notify');
    n.textContent = text;
    n.style.display = 'block';
    n.style.color = color;
    n.style.borderColor = color;
    clearTimeout(n._t);
    n._t = setTimeout(() => n.style.display = 'none', 1800);
  }

  function flashDamage() {
    damageFlashEl.style.opacity = '1';
    clearTimeout(damageFlashEl._t);
    damageFlashEl._t = setTimeout(() => damageFlashEl.style.opacity = '0', 150);
  }

  function switchWeapon(id) {
    if (isReloading) return;
    if (id === currentWeaponId) return;
    setAiming(false);
    rightDown = false;
    currentWeaponId = id;
    buildGunMesh(WEAPONS[id].model);
    updateUI();
    showNotify(WEAPONS[id].name, '#ffaa00');
  }

  function reload() {
    const w = WEAPONS[currentWeaponId];
    if (w.melee || isReloading) return;
    if (w.current >= w.mag || w.reserve <= 0) return;
    setAiming(false);
    isReloading = true;
    showNotify('ПЕРЕЗАРЯДКА...', '#88aaff');
    setTimeout(() => {
      const need = w.mag - w.current;
      const take = Math.min(need, w.reserve);
      w.current += take;
      w.reserve -= take;
      isReloading = false;
      updateUI();
      showNotify('ГОТОВО', '#00ff88');
    }, w.reloadTime * 1000);
  }

  // ==================== СТРЕЛЬБА ====================
  const raycaster = new THREE.Raycaster();

  function getHitNormal(intersect) {
    if (intersect.face) {
      const n = intersect.face.normal.clone();
      n.transformDirection(intersect.object.matrixWorld);
      return n;
    }
    return intersect.point.clone().sub(camera.position).normalize().negate();
  }

  function shoot() {
    const w = WEAPONS[currentWeaponId];
    const now = performance.now() / 1000;
    if (isReloading) return;
    if (now - lastShotTime < w.fireDelay) return;
    if (!w.melee && w.current <= 0) { reload(); return; }
    lastShotTime = now;
    if (!w.melee) w.current--;
    updateUI();

    const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    const start = camera.position.clone();

    if (w.melee) {
      raycaster.set(start, dir);
      raycaster.far = w.range;
      const hits = raycaster.intersectObjects(bots, true);
      if (hits.length) {
        let target = hits[0].object;
        while (target && target.userData.hp === undefined) target = target.parent;
        if (target) damageEnemy(target, w.damage);
      }
      gunGroup.rotation.y = 0.3;
      setTimeout(() => gunGroup.rotation.y = 0, 100);
    } else {
      raycaster.set(start, dir);
      raycaster.far = 600;

      const allObjects = [];
      scene.traverse(o => {
        if (o.isMesh && o !== ground && o !== roofGrid && o !== groundGrid) {
          allObjects.push(o);
        }
      });
      allObjects.push(roof, building);

      const hits = raycaster.intersectObjects(allObjects, true);
      let endPoint;
      if (hits.length) {
        const hit = hits[0];
        endPoint = hit.point.clone();
        const normal = getHitNormal(hit);
        let obj = hit.object;
        let enemyHit = null;
        while (obj) {
          if (obj.userData && obj.userData.hp !== undefined && obj.userData.isEnemy) { enemyHit = obj; break; }
          obj = obj.parent;
        }
        if (enemyHit) {
          damageEnemy(enemyHit, w.damage);
          spawnHitMarker(hit.point, normal, 0xff0000);
          showHitmarker();
        } else {
          spawnHitMarker(hit.point, normal, 0xffaa00);
        }
      } else {
        endPoint = start.clone().add(dir.clone().multiplyScalar(600));
      }
      createTracer(start, endPoint);
    }
  }

  function damageEnemy(enemy, dmg) {
    if (enemy.userData.dead) return;
    enemy.userData.hp -= dmg;

    const originalColors = [];
    enemy.traverse(c => {
      if (c.material && c.material.color) {
        originalColors.push({ m: c.material, c: c.material.color.getHex() });
        c.material.color.setHex(0xffffff);
      }
    });
    setTimeout(() => {
      originalColors.forEach(o => { if (o.m.material) o.m.color.setHex(o.c); });
    }, 60);

    if (enemy.userData.hp <= 0) {
      enemy.userData.dead = true;
      enemy.rotation.z = -Math.PI/2;
      enemy.position.y += 0.5;
      const idx = bots.indexOf(enemy);
      if (idx >= 0) bots.splice(idx, 1);
      score += 100;
      money += 300;
      showNotify('KILL +$300', '#ffcc00');
      updateUI();
      updateEnemyHud();
      setTimeout(() => scene.remove(enemy), 2000);

      if (bots.length === 0) {
        endRound();
      }
    }
  }

  function showHitmarker() {
    hitmarkerEl.classList.add('active');
    clearTimeout(hitmarkerEl._t);
    hitmarkerEl._t = setTimeout(() => hitmarkerEl.classList.remove('active'), 120);
  }

  function createTracer(a, b) {
    const geo = new THREE.BufferGeometry().setFromPoints([a, b]);
    const mat = new THREE.LineBasicMaterial({ color:0xffff88, transparent:true, opacity:0.9 });
    const line = new THREE.Line(geo, mat);
    scene.add(line);

    setTimeout(() => {
      scene.remove(line);
      geo.dispose(); mat.dispose();
    }, 70);
  }

  const hitMarkers = [];
  function spawnHitMarker(point, normal, color = 0xff2200) {
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(0.12, 0.22, 12),
      new THREE.MeshBasicMaterial({ color, side:THREE.DoubleSide, transparent:true, opacity:1 })
    );
    ring.position.copy(point);
    const n = normal.clone().normalize();
    ring.lookAt(point.clone().add(n));
    ring.position.add(n.clone().multiplyScalar(0.02));
    scene.add(ring);

    hitMarkers.push({ mesh:ring, life:0.4, maxLife:0.4 });
  }

  function updateHitMarkers(dt) {
    for (let i = hitMarkers.length - 1; i >= 0; i--) {
      const m = hitMarkers[i];
      m.life -= dt;
      const t = Math.max(0, m.life / m.maxLife);
      m.mesh.material.opacity = t;
      m.mesh.scale.setScalar(1 + (1 - t) * 0.8);
      if (m.life <= 0) {
        scene.remove(m.mesh);
        m.mesh.geometry.dispose();
        m.mesh.material.dispose();
        hitMarkers.splice(i, 1);
      }
    }
  }

  // ==================== УРОН ИГРОКУ ====================
  function damagePlayer(dmg) {
    let remaining = dmg;
    if (player.armor > 0) {
      const absorbed = Math.min(player.armor, dmg * 0.5);
      player.armor -= absorbed;
      remaining -= absorbed;
    }
    player.hp -= remaining;
    flashDamage();
    updateUI();

    if (player.hp <= 0) {
      player.hp = 0;
      updateUI();
      showNotify('ВЫ ПОГИБЛИ', '#ff0000');
      setTimeout(() => {
        player.hp = player.maxHp;
        player.armor = 0;
        player.pos.set(0, ROOF_Y + 0.3 + 1.7, 0);
        updateUI();
        showNotify('РЕСПАВН', '#00ff88');
      }, 2000);
    }
  }

  // ==================== ФИЗИКА ====================
  const GRAVITY = 22;
  const MOVE_SPEED = 11;
  const SPRINT_MULT = 1.7;
  const JUMP_FORCE = 10;

  const roofMinX = -BUILDING_W/2 + parapetT + player.radius;
  const roofMaxX =  BUILDING_W/2 - parapetT - player.radius;
  const roofMinZ = -BUILDING_D/2 + parapetT + player.radius;
  const roofMaxZ =  BUILDING_D/2 - parapetT - player.radius;

  function resolveCollision(pos, radius) {
    for (const c of coverBoxes) {
      const closestX = Math.max(c.minX, Math.min(pos.x, c.maxX));
      const closestZ = Math.max(c.minZ, Math.min(pos.z, c.maxZ));
      const dx = pos.x - closestX;
      const dz = pos.z - closestZ;
      const dist = Math.sqrt(dx * dx + dz * dz);
      if (dist < radius && pos.y - player.height < c.maxY && pos.y > c.minY) {
        const push = (radius - dist) / (dist || 1);
        pos.x += dx * push;
        pos.z += dz * push;
      }
    }
    pos.x = Math.max(roofMinX, Math.min(roofMaxX, pos.x));
    pos.z = Math.max(roofMinZ, Math.min(roofMaxZ, pos.z));
  }

  function updatePlayer(dt) {
    const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
    const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
    const move = new THREE.Vector3();
    if (keys['KeyW']) move.add(forward);
    if (keys['KeyS']) move.sub(forward);
    if (keys['KeyD']) move.add(right);
    if (keys['KeyA']) move.sub(right);
    if (move.length() > 0) move.normalize();

    let spd = isAiming ? MOVE_SPEED * 0.5 : MOVE_SPEED;
    if (keys['ShiftLeft'] || keys['ShiftRight']) spd *= SPRINT_MULT;

    const newPos = player.pos.clone();
    newPos.x += move.x * spd * dt;
    newPos.z += move.z * spd * dt;

    resolveCollision(newPos, player.radius);

    player.pos.x = newPos.x;
    player.pos.z = newPos.z;

    if (keys['Space'] && player.onGround) {
      player.vel.y = JUMP_FORCE;
      player.onGround = false;
    }
    player.vel.y -= GRAVITY * dt;
    player.pos.y += player.vel.y * dt;

    const floorY = ROOF_Y + 0.3 + player.height;
    if (player.pos.y < floorY) {
      player.pos.y = floorY;
      player.vel.y = 0;
      player.onGround = true;
    }

    camera.position.copy(player.pos);
    const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
    camera.quaternion.copy(q);
  }

  // ==================== ИИ ВРАГОВ (БЕГУТ С НОЖАМИ) ====================
  function updateBots(dt, time) {
    for (const bot of bots) {
      if (bot.userData.dead) continue;

      const runCycle = time * 12 * bot.userData.speed;
      bot.rotation.z = Math.sin(runCycle) * 0.08;
      bot.position.y = ROOF_Y + 0.3 + Math.abs(Math.sin(runCycle * 0.5)) * 0.12;

      if (bot.userData.aura) {
        bot.userData.aura.material.opacity = 0.2 + Math.sin(time * 6 + bot.userData.phase) * 0.12;
        bot.userData.aura.rotation.z += dt * 2;
      }
      if (bot.userData.knifeGroup) {
        bot.userData.knifeGroup.rotation.z = Math.sin(runCycle * 1.5) * 0.4;
      }

      let targetPos = player.pos.clone();
      let targetObj = null;
      let minDist = bot.position.distanceTo(player.pos);

      for (const tm of teammates) {
        if (tm.userData.dead) continue;
        const d = bot.position.distanceTo(tm.position);
        if (d < minDist) {
          minDist = d;
          targetPos = tm.position.clone();
          targetObj = tm;
        }
      }

      const dir = new THREE.Vector3().subVectors(targetPos, bot.position);
      dir.y = 0;
      const dist = dir.length();

      if (dist > 1.8) {
        dir.normalize();
        const speed = 5.5 * bot.userData.speed;
        const step = dir.clone().multiplyScalar(speed * dt);

        const newX = bot.position.x + step.x;
        const newZ = bot.position.z + step.z;

        let blocked = false;
        for (const c of coverBoxes) {
          if (newX > c.minX - 0.6 && newX < c.maxX + 0.6 &&
              newZ > c.minZ - 0.6 && newZ < c.maxZ + 0.6) {
            blocked = true;
            break;
          }
        }

        if (!blocked) {
          bot.position.x = newX;
          bot.position.z = newZ;
        } else {
          const perp = new THREE.Vector3(-dir.z, 0, dir.x);
          bot.position.x += perp.x * speed * dt * 0.8;
          bot.position.z += perp.z * speed * dt * 0.8;
        }
      }

      bot.position.x = Math.max(roofMinX + 1, Math.min(roofMaxX - 1, bot.position.x));
      bot.position.z = Math.max(roofMinZ + 1, Math.min(roofMaxZ - 1, bot.position.z));

      bot.userData.attackCooldown -= dt;
      if (dist < 2.2 && bot.userData.attackCooldown <= 0) {
        bot.userData.attackCooldown = 1.0;

        if (targetObj === null) {
          damagePlayer(bot.userData.damage);
          showNotify('ВАС УДАРИЛИ НОЖОМ!', '#ff4444');
        } else {
          targetObj.userData.hp -= bot.userData.damage;
          if (targetObj.userData.hp <= 0) {
            targetObj.userData.dead = true;
            targetObj.rotation.z = -Math.PI/2;
            setTimeout(() => scene.remove(targetObj), 2000);
          }
        }
      }
    }
  }

  // ==================== ИИ ТИММЕЙТОВ ====================
  function updateTeammates(dt, time) {
    for (const tm of teammates) {
      if (tm.userData.dead) continue;
      tm.rotation.z = Math.sin(time * 3 + tm.userData.phase) * 0.03;

      if (tm.userData.aura) {
        tm.userData.aura.material.opacity = 0.2 + Math.sin(time * 5 + tm.userData.phase) * 0.1;
      }

      let nearest = null;
      let nearestDist = Infinity;
      for (const bot of bots) {
        if (bot.userData.dead) continue;
        const d = tm.position.distanceTo(bot.position);
        if (d < nearestDist) { nearestDist = d; nearest = bot; }
      }

      if (nearest) {
        const dir = new THREE.Vector3().subVectors(nearest.position, tm.position);
        dir.y = 0;
        const dist = dir.length();

        if (dist > 8) {
          dir.normalize();
          tm.position.x += dir.x * 3.5 * dt;
          tm.position.z += dir.z * 3.5 * dt;
        }

        tm.userData.attackCooldown -= dt;
        if (dist < 15 && tm.userData.attackCooldown <= 0) {
          tm.userData.attackCooldown = 0.8;
          damageEnemy(nearest, tm.userData.damage);
          createTracer(tm.position.clone().add(new THREE.Vector3(0,1.5,0)), nearest.position.clone().add(new THREE.Vector3(0,1.5,0)));
        }
      } else {
        const dir = new THREE.Vector3().subVectors(player.pos, tm.position);
        dir.y = 0;
        const dist = dir.length();
        if (dist > 4) {
          dir.normalize();
          tm.position.x += dir.x * 2.5 * dt;
          tm.position.z += dir.z * 2.5 * dt;
        }
      }

      tm.position.x = Math.max(roofMinX + 1, Math.min(roofMaxX - 1, tm.position.x));
      tm.position.z = Math.max(roofMinZ + 1, Math.min(roofMaxZ - 1, tm.position.z));
    }
  }

  // ==================== СИСТЕМА РАУНДОВ ====================
  let currentRound = 1;
  const MAX_ROUNDS = 6;
  let roundActive = false;
  let roundTransition = false;

  function startRound(round) {
    currentRound = round;
    updateRoundHud(round);
    roundActive = true;
    roundTransition = false;

    player.hp = player.maxHp;
    player.armor = Math.min(100, 50 + (round - 1) * 10);
    updateUI();

    spawnBotsForRound(round);

    if (round === 3) {
      spawnTeammates();
    }

    showNotify(`РАУНД ${round} — ВРАГИ С НОЖАМИ!`, '#ffcc00');

    setTimeout(() => {
      if (round === 3) {
        showNotify('+ 2 СОЮЗНИКА В БОЮ!', '#00ff88');
      }
    }, 2000);
  }

  function endRound() {
    if (roundTransition) return;
    roundTransition = true;
    roundActive = false;

    if (currentRound >= MAX_ROUNDS) {
      showNotify('🏆 ПОБЕДА! ВСЕ 6 РАУНДОВ ПРОЙДЕНЫ!', '#00ff88');
      setTimeout(() => {
        currentRound = 0;
        money = 0;
        score = 0;
        teammatesSpawned = false;
        for (const tm of teammates) scene.remove(tm);
        teammates.length = 0;
        startRound(1);
      }, 5000);
      return;
    }

    showNotify(`РАУНД ${currentRound} ПРОЙДЕН! ПЕРЕХОД...`, '#00ff88');

    setTimeout(() => {
      startRound(currentRound + 1);
    }, 3000);
  }

  // ==================== ЦИКЛ ====================
  let lastTime = performance.now();
  let gameTime = 0;

  function animate() {
    requestAnimationFrame(animate);
    const now = performance.now();
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    gameTime += dt;

    updatePlayer(dt);
    updateBots(dt, gameTime);
    updateTeammates(dt, gameTime);
    updateHitMarkers(dt);

    camera.fov += (currentFov - camera.fov) * Math.min(1, dt * 15);
    camera.updateProjectionMatrix();

    const w = WEAPONS[currentWeaponId];
    if (mouseDown && (w.auto || !keys['_shot'])) {
      shoot();
      if (!w.auto) keys['_shot'] = true;
    }
    if (!mouseDown) keys['_shot'] = false;

    if (gunGroup.visible) {
      const speed = (keys['KeyW'] || keys['KeyS'] || keys['KeyA'] || keys['KeyD']) ? 1 : 0.3;
      gunGroup.position.y = Math.sin(gameTime * 12) * 0.006 * speed;
      gunGroup.position.x = Math.sin(gameTime * 6) * 0.004 * speed;
      gunGroup.rotation.z = Math.sin(gameTime * 8) * 0.01 * speed;
      gunGroup.rotation.x = Math.cos(gameTime * 5) * 0.005 * speed;
    }

    fillLight.intensity = 0.7 + Math.sin(gameTime * 3) * 0.2;
    fillLight2.intensity = 0.5 + Math.cos(gameTime * 2.5) * 0.2;

    renderer.render(scene, camera);
  }

  // ==================== СТАРТ ====================
  buildGunMesh(WEAPONS[currentWeaponId].model);
  updateUI();
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  player.pos.set(0, ROOF_Y + 0.3 + 1.7, 0);
  camera.position.copy(player.pos);

  startRound(1);
  </script>
</body>
